name: Exporta CSV dos projetos

# A cada sync dos tecnicos (push em dados/**), regenera exportacoes/*.csv.
# As planilhas do Google Drive importam esses CSVs e ficam sempre em dia.
# Tambem regenera exportacoes/painel.json (paineis do tecnico, do admin e da capa).
on:
  push:
    branches: [main]
    paths: ['dados/**', 'estado-equipes.json', 'rotas.json', 'cabos/**', 'scripts/gera_painel.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exporta-csv
  cancel-in-progress: true

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/exporta_csv.py
      - run: python3 scripts/gera_painel.py
      - name: Commit das exportacoes
        run: |
          git config user.name "vera-bot"
          git config user.email "actions@github.com"
          git add exportacoes/
          git diff --cached --quiet && echo "sem mudancas" && exit 0
          git commit -m "VERA: exportacoes CSV atualizadas"
          git push
