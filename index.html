<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1a12">
  <title>VERA — Vegetação em Rede Ativa</title>
  <style>
    :root{color-scheme:dark;}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;overflow:hidden;background:#0a140e;color:#eaf3e8;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
    .splash{position:fixed;inset:0;overflow:hidden;background:#0a140e;}
    /* palco ancorado ao aspecto da arte (941x1672) para que os overlays a acompanhem em qualquer tela */
    .stage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:100%;width:56.28vh;}
    @supports (aspect-ratio:1){.stage{width:auto;aspect-ratio:941/1672;}}
    .stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
    /* brilho animado percorrendo a barra de progresso da arte (~65% da altura) */
    .bar-track{position:absolute;top:65.1%;left:50%;transform:translate(-50%,-50%);width:46%;height:6px;overflow:hidden;border-radius:99px;pointer-events:none;}
    .bar-dot{position:absolute;top:50%;left:-40%;width:40%;height:14px;transform:translateY(-50%);border-radius:99px;
      background:radial-gradient(closest-side,rgba(170,255,165,.95),rgba(120,240,120,.35),transparent 72%);
      filter:blur(1px);animation:vera-sweep 1.9s ease-in-out infinite;}
    @keyframes vera-sweep{0%{left:-40%}50%{left:100%}100%{left:-40%}}
    /* status fica só no DOM (a arte já mostra a mensagem padrão); usado pelo script */
    #status{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;}
    /* erro: card que cobre a faixa de status/versão da arte quando algo falha */
    #error{display:none;position:absolute;top:63%;left:50%;transform:translateX(-50%);width:min(86%,340px);z-index:3;
      padding:14px 16px;border-radius:14px;background:rgba(8,18,12,.94);border:1px solid rgba(192,57,43,.5);
      box-shadow:0 20px 50px rgba(0,0,0,.55);color:#ffb3ab;text-align:left;font-size:13px;line-height:1.45;}
    #error::before{content:"";position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:180vw;height:calc(100% + 40px);z-index:-1;pointer-events:none;
      background:radial-gradient(60% 60% at 50% 45%,rgba(6,13,9,.96),rgba(6,13,9,.7) 55%,transparent 78%);}
    #error strong{color:#ffd0cb}
    #error code{display:block;margin-top:8px;word-break:break-word;font-size:11px;opacity:.85;color:#e9b9b3}
    @media(prefers-reduced-motion:reduce){.bar-dot{animation:none;left:30%}}
  </style>
</head>
<body>
  <div class="splash">
    <div class="stage">
      <img class="stage-bg" src="capa-splash.png" alt="VERA — Vegetação em Rede Ativa" fetchpriority="high">
      <div class="bar-track" aria-hidden="true"><span class="bar-dot"></span></div>
      <p id="status">Preparando sincronização entre dispositivos…</p>
      <div id="error"><strong>Não foi possível iniciar o VERA.</strong><br>Verifique a conexão e atualize a página.<code id="error-detail"></code></div>
    </div>
  </div>
  <script>
  (async function(){
    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const errorDetail = document.getElementById('error-detail');
    const source = 'https://raw.githubusercontent.com/LGRSV/vera-vegetacao/backup/v2.6.14-perf-cabos-unificados/index.html';

    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function(r){ return r.unregister(); }));
      }
      if (typeof caches !== 'undefined' && caches.keys) {
        const chaves = await caches.keys();
        await Promise.all(chaves.map(function(k){ return caches.delete(k); }));
      }
    } catch (limpezaErro) {
      console.warn('Limpeza de SW/cache:', limpezaErro);
    }

    try {
      const response = await fetch(source + '?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('Versão estável indisponível (' + response.status + ').');
      let html = await response.text();
      html = html
        .replace(
          '<div class="camadas-title">Visualização</div>',
          '<div class="camadas-title" id="camadas-title-row" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="toggleMinimizarCamadas()"><span>Visualização</span><span id="camadas-min-icon" style="font-size:13px;font-weight:700;">−</span></div>'
        )
        .replace(
          '<button id="btn-ver-rede" onclick="toggleRedeAdmin()" style="padding:4px 10px;font-size:11px;border:1.5px solid #1565C0;border-radius:6px;background:#fff;color:#1565C0;cursor:pointer;font-family:inherit;font-weight:600;">Ver Rede</button>',
          '<button id="btn-ver-rede" onclick="toggleRedeAdmin()" style="padding:4px 10px;font-size:11px;border:1.5px solid #1565C0;border-radius:6px;background:#fff;color:#1565C0;cursor:pointer;font-family:inherit;font-weight:600;">Ver Rede</button><button id="btn-tela-cheia-admin-mapa" onclick="toggleTelaCheiaAdminMapa()" title="Ver mapa em tela cheia" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--white);cursor:pointer;font-family:inherit;font-weight:600;">⛶ Tela cheia</button>'
        )
        .replace(
          '<div id="admin-map-container">\n        <div id="admin-map"></div>',
          '<div id="admin-map-container"><button id="btn-sair-tela-cheia-admin-mapa" onclick="toggleTelaCheiaAdminMapa()" style="display:none;">✕ Sair da tela cheia</button>\n        <div id="admin-map"></div>'
        )
        .replace('</style>',
          '.camadas-control.minimizado .cam-btn,.camadas-control.minimizado .camadas-resumo{display:none!important;}.camadas-control.minimizado{padding:6px 8px;gap:0;}.camadas-control.minimizado .camadas-title{padding:0;}#admin-map-container{position:relative;}#admin-map-container.vera-tela-cheia{position:fixed;inset:0;z-index:99999;margin:0;border-radius:0;background:#fff;}#admin-map-container.vera-tela-cheia #admin-map{height:100%!important;}#admin-map-container.vera-tela-cheia .admin-map-legend{position:absolute;left:0;right:0;bottom:0;}#btn-sair-tela-cheia-admin-mapa{position:absolute;top:10px;right:10px;z-index:2;padding:8px 14px;font-size:12px;font-weight:700;border:none;border-radius:8px;background:#1a2e1a;color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.25);}#admin-map-container.vera-tela-cheia #btn-sair-tela-cheia-admin-mapa{display:block!important;}</style>'
        )
        .replace('</body>',
          '<' + 'script>function toggleMinimizarCamadas(){var c=document.getElementById("camadas-control");var ic=document.getElementById("camadas-min-icon");if(!c)return;var min=c.classList.toggle("minimizado");if(ic)ic.textContent=min?"+":"−";try{localStorage.setItem("vera_camadas_min",min?"1":"0");}catch(e){}}(function(){try{if(localStorage.getItem("vera_camadas_min")==="1"){var apl=function(){var c=document.getElementById("camadas-control");var ic=document.getElementById("camadas-min-icon");if(c){c.classList.add("minimizado");if(ic)ic.textContent="+";}};if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",apl);else apl();}}catch(e){}})();function toggleTelaCheiaAdminMapa(){var c=document.getElementById("admin-map-container");if(!c)return;var ativo=c.classList.toggle("vera-tela-cheia");document.body.style.overflow=ativo?"hidden":"";setTimeout(function(){if(typeof adminMap!=="undefined"&&adminMap&&adminMap.invalidateSize)adminMap.invalidateSize();},220);}document.addEventListener("keydown",function(ev){if(ev.key==="Escape"){var c=document.getElementById("admin-map-container");if(c&&c.classList.contains("vera-tela-cheia"))toggleTelaCheiaAdminMapa();}});<' + '/script></body>'
        )
        .replaceAll('2.6.14', '2.6.20')
        .replace(
          "if (primeira < 0) throw new Error('Trecho não encontrado: ' + nome + '.');",
          "if (primeira < 0) { console.warn('Trecho não encontrado:', nome); return html; }"
        );

      const fimDoApp = '      document.open();\n      document.write(html);\n      document.close();';
      const fimComRecursos = '      html = html.replace(\'</body>\', \'<script src="estado-equipes.js?t=' + Date.now() + '"><\\/script><script src="sincronizacao-dispositivos.js?t=' + Date.now() + '"><\\/script><script src="protege-ids-remotos.js?t=' + Date.now() + '"><\\/script><script src="hotfix-fotos.js?t=' + Date.now() + '"><\\/script><script src="admin-historico-v3.js?t=' + Date.now() + '"><\\/script><script src="admin-armazenamento.js?t=' + Date.now() + '"><\\/script><script src="conclusao-rotas.js?t=' + Date.now() + '"><\\/script><script src="capa-visual.js?t=' + Date.now() + '"><\\/script></body>\');\n' + fimDoApp;
      if (html.indexOf(fimDoApp) < 0) throw new Error('Não foi possível conectar a sincronização ao app.');
      html = html.replace(fimDoApp, fimComRecursos);

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      status.textContent = 'A inicialização foi interrompida para preservar os dados.';
      errorBox.style.display = 'block';
      errorDetail.textContent = String(error && error.message ? error.message : error);
      console.error('VERA sincronização:', error);
    }
  })();
  </script>
</body>
<!-- bust 1782901820 -->
</html>
